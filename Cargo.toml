[workspace]
members = ["crates/*"]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "BUSL-1.1"
exclude = [".github/"]

[workspace.dependencies]

lib-reth = { path = "./crates/lib-reth" }
eth-network-exts = { path = "./crates/eth-network-exts" }
uniswap-storage = { path = "./crates/uniswap-storage" }
exe-runners = { path = "./crates/exe-runners" }

# reth: the regular release (redirected to Base's fork by the [patch] below)
reth-db = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2", default-features = false }
reth-provider = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-tasks = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-network-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-node-ethereum = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-revm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-evm = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-rpc-eth-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-storage-api = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }
reth-node-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.5.2" }

# base: one tag for every crate
base-node-core = { git = "https://github.com/base/base", tag = "v1.4.2" }
base-execution-chainspec = { git = "https://github.com/base/base", tag = "v1.4.2" }
base-execution-evm = { git = "https://github.com/base/base", tag = "v1.4.2", features = ["rpc"] }
base-execution-rpc = { git = "https://github.com/base/base", tag = "v1.4.2" }
base-execution-txpool = { git = "https://github.com/base/base", tag = "v1.4.2" }
base-common-consensus = { git = "https://github.com/base/base", tag = "v1.4.2", features = ["reth"] }
base-common-rpc-types = { git = "https://github.com/base/base", tag = "v1.4.2", features = ["reth"] }
base-common-network = { git = "https://github.com/base/base", tag = "v1.4.2" }
base-common-evm = { git = "https://github.com/base/base", tag = "v1.4.2" }


# alloy
alloy-provider = { version = "2.3.0", default-features = false }
alloy-rpc-client = { version = "2.3.0", default-features = false }
alloy-network = { version = "2.3.0", default-features = false }
alloy-rpc-types = { version = "2.3.0", default-features = false }
alloy-sol-types = { version = "1.6.1", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false }
alloy-eips = { version = "2.3.0", default-features = false }


# revm
revm-database = { version = "42.0.0", default-features = false }
revm = { version = "42.0.1", features = [
    "std",
    "secp256k1",
    "optional_balance_check",
    "optional_block_gas_limit",
    "c-kzg",
], default-features = false }

# async
tokio = "1"
futures = "0.3"
futures-util = "0.3"
async-trait = "0"
dashmap = "6.0"
thread-priority = "3.0.0"
rayon = "1.7"
crossbeam-utils = "0.8"
parking_lot = "0.12"
pin-project = "1.0.12"
libc = "0.2"


# misc
eyre = "0.6.5"
tracing-futures = "0.2"
tracing = "0.1.0"
auto_impl = "1"
dyn-clone = "1.0.17"
thiserror = "1.0"

# testing
serial_test = "3.1"


# The Base crates build against Base's reth fork, so every reth-* crate above is redirected to it
# to link a single reth. Any reth-* crate added above needs a line here too. This tag, the base/base
# tag and the reth tag above (the release the fork is based on) move together.
[patch."https://github.com/paradigmxyz/reth"]
reth-db = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-provider = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-rpc = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-rpc-eth-types = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-transaction-pool = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-tasks = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-network-api = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-node-ethereum = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-rpc-convert = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-chainspec = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-revm = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-evm = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-rpc-eth-api = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-storage-api = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
reth-node-types = { git = "https://github.com/base/reth", tag = "base-v2.5.2.6" }
