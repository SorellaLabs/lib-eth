[package]
name = "lib-reth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
exclude.workspace = true

[lib]
name = "lib_reth"
path = "src/lib.rs"

[dependencies]

# reth
reth-provider = { workspace = true, optional = true }
reth-rpc = { workspace = true, optional = true }
reth-rpc-eth-types = { workspace = true, optional = true }
reth-transaction-pool = { workspace = true, optional = true }
reth-tasks = { workspace = true, optional = true }
reth-network-api = { workspace = true, optional = true }
reth-node-ethereum = { workspace = true, optional = true }
reth-chainspec = { workspace = true, optional = true }
reth-db = { workspace = true, optional = true, default-features = false, features = [
    "mdbx",
] }
reth-revm = { workspace = true, optional = true }
reth-rpc-eth-api = { workspace = true, optional = true }
reth-storage-api = { workspace = true, optional = true }
reth-node-types = { workspace = true, optional = true }
reth-evm = { workspace = true, optional = true }
uniswap-storage = { workspace = true, optional = true }
eth-network-exts.workspace = true

# base
base-node-core = { workspace = true, optional = true }
base-execution-chainspec = { workspace = true, optional = true }
base-execution-evm = { workspace = true, optional = true }
base-execution-rpc = { workspace = true, optional = true }
base-execution-txpool = { workspace = true, optional = true }
base-common-consensus = { workspace = true, optional = true }
base-common-rpc-types = { workspace = true, optional = true }
base-common-network = { workspace = true, optional = true }
base-common-evm = { workspace = true, optional = true }

# alloy
alloy-provider = { workspace = true, default-features = false, features = [
    "ipc",
    "ws",
    "pubsub",
    "reqwest",
] }
alloy-rpc-client = { workspace = true, default-features = false, features = [
    "ipc",
    "ws",
    "pubsub",
] }
alloy-network = { workspace = true, default-features = false }
alloy-rpc-types = { workspace = true, default-features = false, features = [
    "eth",
] }
alloy-primitives = { workspace = true, default-features = false }
alloy-eips = { workspace = true, optional = true }


# revm
revm.workspace = true
revm-database = { workspace = true, default-features = false, features = [
    "alloydb",
] }

# async
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
async-trait.workspace = true

# misc
eyre.workspace = true
exe-runners = { workspace = true, features = ["reth-tasks"] }
auto_impl.workspace = true


[dev-dependencies]
serial_test.workspace = true


[features]
default = ["full"]
full = ["mainnet-full", "base-full", "ipc", "ws", "uniswap-storage"]


ipc = []
ws = []


mainnet-full = ["revm", "reth-db"]
base-full = ["base-revm", "base-reth-db"]
# kept as an alias so downstream crates that enable `lib-reth/op-full` build unchanged
op-full = ["base-full"]


revm = ["dep:alloy-eips", "dep:reth-revm", "dep:reth-evm"]
base-revm = ["revm", "dep:base-common-evm"]


reth-db = [
    "dep:reth-provider",
    "dep:reth-rpc",
    "dep:reth-transaction-pool",
    "dep:reth-tasks",
    "dep:reth-network-api",
    "dep:reth-node-ethereum",
    "dep:reth-chainspec",
    "dep:reth-rpc-eth-types",
    "dep:reth-db",
    "dep:reth-node-types",
    "dep:reth-storage-api",
    "dep:reth-rpc-eth-api",
]
base-reth-db = [
    "reth-db",
    "dep:base-node-core",
    "dep:base-execution-chainspec",
    "dep:base-execution-evm",
    "dep:base-execution-rpc",
    "dep:base-execution-txpool",
    "dep:base-common-consensus",
    "dep:base-common-rpc-types",
    "dep:base-common-network",
    "uniswap-storage/l2-angstrom",
    "eth-network-exts/l2",
]


uniswap-storage = ["dep:uniswap-storage", "dep:alloy-eips"]
rayon = ["exe-runners/rayon"]

ci = []
